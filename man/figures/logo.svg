<svg xmlns="http://www.w3.org/2000/svg" width="240" height="278" viewBox="0 0 240 278">
  <title>tidypptsdm</title>
  <polygon points="120,5 235,71.5 235,206.5 120,273 5,206.5 5,71.5" fill="#ffffff" stroke="#1B2A4A" stroke-width="8" stroke-linejoin="round"/>
  <text x="120" y="92" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="27" fill="#1B2A4A">tidypptsdm</text>
  <!-- monitor -->
  <rect x="58" y="110" width="124" height="82" rx="7" fill="#EEF4FB" stroke="#1B2A4A" stroke-width="5"/>
  <rect x="111" y="192" width="18" height="14" fill="#1B2A4A"/>
  <rect x="86" y="205" width="68" height="8" rx="4" fill="#1B2A4A"/>
  <!-- daily bars -->
  <g fill="#9DC3E6">
    <rect x="70" y="160" width="11" height="22"/>
    <rect x="86" y="154" width="11" height="28"/>
    <rect x="102" y="157" width="11" height="25"/>
    <rect x="118" y="150" width="11" height="32"/>
    <rect x="134" y="153" width="11" height="29"/>
    <rect x="150" y="172" width="11" height="10" fill="#F8696B"/>
  </g>
  <!-- trend line with an alert on the last day -->
  <polyline points="75,142 91,134 107,138 123,126 139,131 155,159" fill="none" stroke="#0F6CBD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="155" cy="159" r="6" fill="#D55E00" stroke="#ffffff" stroke-width="2"/>
  <!-- pig snout on the screen corner -->
  <ellipse cx="164" cy="125" rx="9" ry="7" fill="#F4B6C2" stroke="#1B2A4A" stroke-width="2"/>
  <circle cx="161" cy="125" r="1.6" fill="#1B2A4A"/>
  <circle cx="167" cy="125" r="1.6" fill="#1B2A4A"/>
  <text x="196" y="236" text-anchor="middle" transform="rotate(-30 196 236)" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1B2A4A">tony2015116.github.io/tidypptsdm</text>
</svg>
