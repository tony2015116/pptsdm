url: https://tony2015116.github.io/tidypptsdm/
template:
  bootswatch: cosmo
  theme: arrow-dark
navbar:
  bg: light
  structure:
    left:  [getstarted, reference, articles, news]
    right: [github, lightswitch]

  components:
    getstarted:
      text: Get started
      href: articles/get-started.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/tony2015116/tidypptsdm
      aria-label: GitHub

reference:
- title: Daily round
  desc: Run every table and the alerts of the last day in one call.
  contents:
  - run_monitor
- title: Daily tables
  desc: One row per station, house or pig and day of the window, also for days without any visit; and the hours of one day.
  contents:
  - monitor_stations
  - monitor_houses
  - monitor_pigs
  - monitor_hours
  - wide_table
- title: Plots
  desc: One plot per station - trend, feed intake heat map, body weights, hours of the day.
  contents:
  - plot_monitor
  - save_monitor_plots
- title: Export
  desc: An HTML report to browse station by station, and an Excel workbook or CSV files.
  contents:
  - write_monitor_report
  - write_monitor_tables
- title: Run every day
  desc: Write the monitor script and schedule it (Windows Task Scheduler or cron).
  contents:
  - schedule_monitor
- title: Read and prepare station data
  desc: Re-exported from tidypptsda.
  contents:
  - reexports

articles:
- title: 入门
  navbar: 入门
  desc: 从导出文件到报告：每天的巡检流程。
  contents:
  - articles/tidypptsdm-zh
- title: 结果
  navbar: 结果
  desc: 每张表、每一列、每条警报和每张图的含义。
  contents:
  - articles/output-zh
- title: 运行
  navbar: 运行
  desc: 每天定时运行；从 pptsdm 0.1.4 迁移。
  contents:
  - articles/schedule-zh
  - articles/migrate-zh
- title: internal
  contents:
  - get-started

news:
  one_page: true
